steps:
  - name: Select Xcode
    uses: maxim-lobanov/setup-xcode@v1
    with:
      xcode-version: 16

  - name: Checkout
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Diagnose Xcode / Swift
    run: |
      xcodebuild -version || true
      swift --version || true
      ls -la /Applications || true
      find /Applications -maxdepth 2 -type d -name "Xcode*.app" -print || true

  - name: Select Xcode app (if present)
    if: ${{ always() }}
    run: |
      # adjust path to the actual Xcode app name found by the diagnose step if needed
      if [ -d "/Applications/Xcode_16.app" ]; then
        sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
      fi
      xcodebuild -version || true
      swift --version || true

  - name: Build
    uses: sersoft-gmbh/xcodebuild-action@v3
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer   # set to the actual Xcode app path
    with:
      action: build
      build-settings: ONLY_ACTIVE_ARCH=NO TEST_AFTER_BUILD=NO SWIFT_VERSION=6.0
      configuration: Debug
      derived-data-path: "${{ github.workspace }}/SplitApp"
      destination: ${{ inputs.destination }}
      project: Split.xcodeproj
      scheme: ${{ inputs.scheme }}
