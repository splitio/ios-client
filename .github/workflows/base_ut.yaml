name: Build and Test iOS UT

on:
  workflow_call:
    inputs:
      test-plan:
        description: The test plan to run
        required: true
        type: string
      destination:
        required: true
        type: string
      scheme:
        description: The Xcode scheme to build and test
        required: true
        type: string

jobs:
  test:
    runs-on: [macos-15-xlarge]

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Determine Swift Version
        id: swift-version
        run: |
          if [[ "${{ inputs.scheme }}" == *"Swift5"* ]]; then
            echo "version=5.0" >> $GITHUB_OUTPUT
          else
            echo "version=6.0" >> $GITHUB_OUTPUT
          fi

      - name: Log Swift Version
        run: |
          echo "Building with SWIFT_VERSION=${{ steps.swift-version.outputs.version }} (scheme: ${{ inputs.scheme }})"

      - name: Build iOS and Test
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: |
            set -o pipefail
            xcodebuild test \
              -project Split.xcodeproj \
              -scheme ${{ inputs.scheme }} \
              -destination '${{ inputs.destination }}' \
              -testPlan ${{ inputs.test-plan }} \
              -configuration Debug \
              -sdk iphonesimulator \
              ONLY_ACTIVE_ARCH=NO \
              SWIFT_VERSION=${{ steps.swift-version.outputs.version }} | xcbeautify
